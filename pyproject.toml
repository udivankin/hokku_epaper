[tool.ruff]
line-length = 100
target-version = "py39"
src = ["python", "tools"]
exclude = [
    ".venv",
    "python/build",
    "python/.pybuild",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "PLC0415", "S", "C4", "RUF"]
ignore = [
    "E501",   # line too long — formatter handles this
    "S101",   # assert — invariant checks are intentional and desirable in this codebase
    "S603",   # subprocess with list args — all calls in this codebase use fixed lists
    "S310",   # urllib URL open — all URLs are https:// to known hosts
    "S608",   # SQL injection — no SQL in this codebase; false positive on bash heredoc
    "RUF001", # ambiguous unicode in strings — intentional math notation (×, –, −, σ)
    "RUF002", # same in docstrings
    "RUF003", # same in comments
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "S106"]               # assert and test credentials are normal in pytest
"tools/phoenixmc_*.py" = ["S110", "E722", "E402", "F401", "PLC0415"]  # GUI automation: bare except-pass is intentional
"tools/_dump_bigme_f7.py" = ["S110", "E402", "PLC0415"]  # serial retry + sys.path/lazy imports

[tool.ruff.lint.isort]
known-first-party = ["hokku"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
# "tools" is on the path because the tools import each other via a sys.path insert.
extraPaths = ["python", "tools"]
include = [
    "python/hokku",
    "python/tests",
    "tools",
]
exclude = [
    ".venv",
    "python/build",
    "python/.pybuild",
]
typeCheckingMode = "basic"

[tool.coverage.run]
source = ["python/hokku"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "raise NotImplementedError",
]
