[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hokku-device"
version = "1.0.0"
description = "Screen specs and flashing helpers used by the Hokku device tools in tools/"
requires-python = ">=3.9"
license = {text = "GPL-3.0 (non-commercial)"}
authors = [{ name = "Dennis Fleurbaaij", email = "mail@dennisfleurbaaij.com" }]
dependencies = [
    "pillow>=9.0",
    "numpy>=1.20",
    # Firmware version ordering (hokku.common.firmware_paths.version_key) — the
    # only correct way to rank 1.2.10 above 1.2.9.
    "packaging>=20",
    # Serial flashing and consoles. esptool / esp-idf-nvs-partition-gen are
    # invoked as subprocesses by hokku.common.esp32.
    "pyserial>=3.5",
    "esptool>=4.7",
    "esp-idf-nvs-partition-gen",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hokku*"]

[tool.setuptools.package-data]
"hokku.screens.bigme_f7" = ["correction_lut.npy"]
"hokku.screens.huessen_epf1301" = ["correction_lut.npy"]
